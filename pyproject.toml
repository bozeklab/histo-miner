
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histo-miner"
dynamic = ["version"]
description = "Tissue feature extraction with deep learning from H&E images of cutaneous squamous cell carcinoma"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Lucas Sancéré"}]
keywords = ["digital-pathology", "histopathology", "whole-slide-imaging", "feature-extraction", "squamous-cell-carcinoma"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "scikit-image>=0.19",
    "scikit-learn>=1.3",
    "pandas>=1.5",
    "opencv-python-headless>=4.8",
    "pillow>=9.0",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.60",
    "pyyaml>=6.0",
    "attrdictionary>=1.0",
    "requests>=2.27",
]

[project.optional-dependencies]
wsi = ["openslide-python>=1.1", "imagesize>=1.4"]
ml  = ["xgboost>=1.5", "lightgbm>=4.0", "boruta>=0.3"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/bozeklab/histo-miner"
Publication = "https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1013907"

[tool.setuptools.packages.find]
where = ["src"]
include = ["histo_miner*"]

[tool.setuptools.dynamic]
version = { attr = "histo_miner.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: tests that take more than a few seconds"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

